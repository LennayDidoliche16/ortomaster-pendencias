<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PENDÊNCIAS - ORTOMASTER</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --vinho: #6B0000;
    --vinho-dark: #4E0000;
    --vinho-soft: #8A1A1A;
    --bg: #F7F3F1;
    --card: #FFFFFF;
    --line: #E7DFDC;
    --ink: #2B2320;
    --ink-soft: #75655F;
    --amber: #C8880A;
    --amber-bg: #FCEFCF;
    --green: #1F7A4D;
    --green-bg: #DEF3E7;
    --gray: #7A7370;
    --gray-bg: #ECE7E4;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  .font-display{font-family:'Sora',sans-serif;}
  ::selection{background:#6B000030;}

  .badge{
    display:inline-flex; align-items:center; gap:.4rem;
    padding:.3rem .7rem; border-radius:999px;
    font-size:.72rem; font-weight:700; letter-spacing:.03em;
    text-transform:uppercase; white-space:nowrap;
  }
  .badge-pendente{background:var(--amber-bg); color:#8A5D06; border:1px solid #E9C877;}
  .badge-concluido{background:var(--green-bg); color:var(--green); border:1px solid #A9DFC0;}
  .badge-cancelado{background:var(--gray-bg); color:#57514E; border:1px solid #D2CAC5;}

  .cat-dot{width:.5rem; height:.5rem; border-radius:999px; flex:none;}
  .cat-pill{
    display:inline-flex; align-items:center; gap:.45rem;
    font-size:.78rem; font-weight:600; color:var(--ink);
  }

  .row-hover:hover{ background:#FBF6F4; }

  .th-cell{
    background:var(--vinho); color:#fff; text-transform:uppercase;
    letter-spacing:.06em; font-size:.72rem; font-weight:700;
    padding:.85rem 1rem; text-align:left; white-space:nowrap;
  }

  .btn-primary{
    background:var(--vinho); color:#fff; font-weight:600;
    transition:background .15s ease, transform .1s ease;
  }
  .btn-primary:hover{ background:var(--vinho-dark); }
  .btn-primary:active{ transform:scale(.98); }

  select, input[type="text"], input[type="date"], input[type="color"]{
    outline:none;
  }
  select:focus, input:focus{
    border-color: var(--vinho) !important;
    box-shadow: 0 0 0 3px #6B000022;
  }

  .modal-backdrop{
    background: rgba(43,35,32,.45);
    backdrop-filter: blur(2px);
  }
  .modal-card{
    animation: rise .18s ease-out;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(8px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .icon-btn{
    width:2rem; height:2rem; display:inline-flex; align-items:center; justify-content:center;
    border-radius:.5rem; transition:background .15s ease;
  }
  .icon-btn:hover{ background:#00000010; }

  @media (max-width: 720px){
    .stat-strip{ flex-wrap:wrap; }
  }
</style>
</head>
<body class="min-h-screen">

<header style="background:var(--vinho);" class="w-full py-6 px-4 shadow-md flex items-center justify-center text-center">
  <h1 class="font-display text-white font-extrabold tracking-wide text-xl sm:text-2xl md:text-3xl">
    PENDÊNCIAS &nbsp;·&nbsp; ORTOMASTER
  </h1>
</header>

<main class="max-w-7xl mx-auto px-3 sm:px-6 py-6">

  <div class="stat-strip flex gap-3 mb-5">
    <div class="flex-1 min-w-[130px] bg-white rounded-xl border" style="border-color:var(--line);" >
      <div class="px-4 py-3">
        <p class="text-[.7rem] uppercase tracking-wide font-semibold" style="color:var(--ink-soft);">Total</p>
        <p id="stat-total" class="font-display text-2xl font-bold" style="color:var(--ink);">0</p>
      </div>
    </div>
    <div class="flex-1 min-w-[130px] bg-white rounded-xl border" style="border-color:var(--line);">
      <div class="px-4 py-3">
        <p class="text-[.7rem] uppercase tracking-wide font-semibold" style="color:#8A5D06;">Pendentes</p>
        <p id="stat-pendente" class="font-display text-2xl font-bold" style="color:var(--amber);">0</p>
      </div>
    </div>
    <div class="flex-1 min-w-[130px] bg-white rounded-xl border" style="border-color:var(--line);">
      <div class="px-4 py-3">
        <p class="text-[.7rem] uppercase tracking-wide font-semibold" style="color:var(--green);">Concluídas</p>
        <p id="stat-concluido" class="font-display text-2xl font-bold" style="color:var(--green);">0</p>
      </div>
    </div>
    <div class="flex-1 min-w-[130px] bg-white rounded-xl border" style="border-color:var(--line);">
      <div class="px-4 py-3">
        <p class="text-[.7rem] uppercase tracking-wide font-semibold" style="color:#57514E;">Canceladas</p>
        <p id="stat-cancelado" class="font-display text-2xl font-bold" style="color:var(--gray);">0</p>
      </div>
    </div>
  </div>

  <div class="bg-white rounded-xl border p-3 sm:p-4 mb-4" style="border-color:var(--line);">
    <div class="flex flex-col lg:flex-row lg:items-center gap-3">

      <div class="relative flex-1 min-w-[200px]">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A8C86" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="text" placeholder="Buscar por nome ou prontuário..."
          class="w-full pl-9 pr-3 py-2 rounded-lg border text-sm" style="border-color:var(--line);">
      </div>

      <div class="flex flex-wrap gap-2">
        <select id="filter-dentista" class="py-2 px-3 rounded-lg border text-sm bg-white" style="border-color:var(--line);">
          <option value="">Todos os dentistas</option>
        </select>
        <select id="filter-categoria" class="py-2 px-3 rounded-lg border text-sm bg-white" style="border-color:var(--line);">
          <option value="">Todas as categorias</option>
        </select>
        <select id="filter-situacao" class="py-2 px-3 rounded-lg border text-sm bg-white" style="border-color:var(--line);">
          <option value="">Todas as situações</option>
          <option value="PENDENTE">Pendente</option>
          <option value="CONCLUÍDO">Concluído</option>
          <option value="CANCELADO">Cancelado</option>
        </select>
      </div>

      <button id="btn-manage" class="rounded-lg px-4 py-2 text-sm flex items-center gap-2 justify-center border font-semibold" style="border-color:var(--line); color:var(--vinho);">
